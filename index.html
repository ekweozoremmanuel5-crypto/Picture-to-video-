<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picture to Video Maker - Turn Photos to Video Instantly</title>
<meta name="description" content="Picture to Video Maker - Turn your photos into HD videos instantly. Upload pictures, set duration and create smooth slideshows in seconds. No watermark, no app, no login. Works on any phone or PC.">
<style>
body{font-family:Arial;background:#0f0f0f;color:#fff;text-align:center;padding:20px;margin:0}
h1{color:#ff0050}
.box{background:#1e1e1e;padding:20px;border-radius:15px;max-width:500px;margin:20px auto}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:16px}
button{background:#ff0050;color:#fff;font-weight:bold;cursor:pointer}
button:disabled{background:#555}
#preview{width:100%;max-height:300px;margin-top:10px;border-radius:10px;display:none}
canvas{display:none}
</style>
</head>
<body>
<h1>📸 ➡️ 🎥 Picture to Video Maker</h1>
<p>Turn your photos into HD videos instantly. No watermark, no app needed.</p>
<div class="box">
<input type="file" id="images" accept="image/*" multiple>
<label>Duration per picture (seconds):</label>
<input type="number" id="duration" value="2" min="1" max="10">
<button id="createBtn">Create Video</button>
<button id="downloadBtn" style="display:none;background:#00d26a">Download Video</button>
<video id="preview" controls></video>
<p id="status"></p>
</div>
<canvas id="canvas"></canvas>
<script>
let images = [];
let mediaRecorder;
let chunks = [];
document.getElementById('images').onchange = e => {
  images = Array.from(e.target.files);
  document.getElementById('status').innerText = images.length + " pictures selected";
};
document.getElementById('createBtn').onclick = async () => {
  if(images.length==0){alert("Select pictures first");return}
  const duration = parseInt(document.getElementById('duration').value);
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 720; canvas.height = 1280;
  const stream = canvas.captureStream(30);
  mediaRecorder = new MediaRecorder(stream, {mimeType:'video/webm'});
  chunks = [];
  mediaRecorder.ondataavailable = e => chunks.push(e.data);
  mediaRecorder.onstop = () => {
    const blob = new Blob(chunks, {type:'video/webm'});
    const url = URL.createObjectURL(blob);
    const v = document.getElementById('preview');
    v.src = url; v.style.display='block';
    const dl = document.getElementById('downloadBtn');
    dl.style.display='block';
    dl.onclick = () => { const a=document.createElement('a'); a.href=url; a.download='picture-video.webm'; a.click(); };
    document.getElementById('status').innerText = "Done! Video ready below.";
  };
  mediaRecorder.start();
  document.getElementById('status').innerText = "Creating video... please wait";
  for(let file of images){
    const img = await loadImage(file);
    drawCover(ctx, img, canvas.width, canvas.height);
    await wait(duration*1000);
  }
  mediaRecorder.stop();
};
function loadImage(file){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=URL.createObjectURL(file)})}
function drawCover(ctx, img, w, h){
  const scale = Math.max(w/img.width, h/img.height);
  const x = (w - img.width*scale)/2;
  const y = (h - img.height*scale)/2;
  ctx.drawImage(img, x, y, img.width*scale, img.height*scale);
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
</script>
</body>
</html>
