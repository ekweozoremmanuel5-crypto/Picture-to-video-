<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Picture to Video Maker with Text</title><style>body{font-family:Arial;background:#0f0f0f;color:#fff;text-align:center;padding:15px}h1{color:#ff0050;font-size:22px}.box{background:#1e1e1e;padding:15px;border-radius:15px;max-width:500px;margin:15px auto}input,textarea,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:15px;box-sizing:border-box}textarea{background:#2a2a2a;color:#fff;min-height:70px}button{background:#ff0050;color:#fff;font-weight:bold}#preview{width:100%;max-height:400px;margin-top:10px;border-radius:10px;display:none;background:#000}.img-item{background:#2a2a2a;padding:10px;border-radius:10px;margin:8px 0;text-align:left}.img-item img{width:60px;height:60px;object-fit:cover;border-radius:5px}.small{font-size:13px;color:#aaa}</style></head><body><h1>📸 ➡️ 🎥 Picture to Video with Text</h1><p class="small">Add photos + write what each photo will say</p><div class="box"><input type="file" id="images" accept="image/*" multiple><div id="list"></div><label>Duration per picture (seconds):</label><input type="number" id="duration" value="3" min="1" max="10"><label>Text position:</label><select id="textPos"><option value="bottom">Text at Bottom</option><option value="top">Text at Top</option><option value="center">Text at Center</option></select><button id="createBtn">Create Video with Text</button><button id="downloadBtn" style="display:none;background:#00d26a">⬇️ Download Video</button><video id="preview" controls></video><p id="status" class="small"></p></div><canvas id="canvas" style="display:none"></canvas><script>let filesData=[];document.getElementById('images').onchange=e=>{filesData=Array.from(e.target.files).map(f=>({file:f,text:''}));renderList()};function renderList(){const list=document.getElementById('list');list.innerHTML='';filesData.forEach((item,idx)=>{const div=document.createElement('div');div.className='img-item';const imgUrl=URL.createObjectURL(item.file);div.innerHTML=`<img src="${imgUrl}"> <b>Photo ${idx+1}</b><br><textarea placeholder="Write what this picture will say..." oninput="filesData[${idx}].text=this.value">${item.text}</textarea>`;list.appendChild(div)});document.getElementById('status').innerText=filesData.length+" pictures loaded - now write text for each"}document.getElementById('createBtn').onclick=async()=>{if(filesData.length==0){alert("Select pictures first");return}const duration=parseInt(document.getElementById('duration').value);const pos=document.getElementById('textPos').value;const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');canvas.width=720;canvas.height=1280;const stream=canvas.captureStream(30);const recorder=new MediaRecorder(stream,{mimeType:'video/webm'});let chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});const url=URL.createObjectURL(blob);const v=document.getElementById('preview');v.src=url;v.style.display='block';const dl=document.getElementById('downloadBtn');dl.style.display='block';dl.onclick=()=>{const a=document.createElement('a');a.href=url;a.download='picture-video-with-text.webm';a.click()};document.getElementById('status').innerText="✅ Video ready! Watch above."};recorder.start();document.getElementById('status').innerText="⏳ Creating video... please wait";for(let item of filesData){const img=await loadImage(item.file);const start=Date.now();while(Date.now()-start<duration*1000){drawCover(ctx,img,canvas.width,canvas.height);if(item.text)drawText(ctx,item.text,canvas.width,canvas.height,pos);await wait(33)}}recorder.stop()};function loadImage(file){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=URL.createObjectURL(file)})}function drawCover(ctx,img,w,h){const scale=Math.max(w/img.width,h/img.height);const x=(w-img.width*scale)/2;const y=(h-img.height*scale)/2;ctx.drawImage(img,x,y,img.width*scale,img.height*scale)}function drawText(ctx,text,w,h,pos){ctx.fillStyle="rgba(0,0,0,0.6)";let y=h-180;if(pos=="top")y=120;if(pos=="center")y=h/2;ctx.fillRect(0,y-60,w,140);ctx.fillStyle="#fff";ctx.font="bold 32px Arial";ctx.textAlign="center";wrapText(ctx,text,w/2,y,w-80,40)}function wrapText(ctx,text,x,y,maxWidth,lineHeight){const words=text.split(' ');let line='';let lines=[];for(let n=0;n<words.length;n++){let testLine=line+words[n]+' ';if(ctx.measureText(testLine).width>maxWidth&&n>0){lines.push(line);line=words[n]+' ';}else{line=testLine;}}lines.push(line);lines.forEach((l,i)=>ctx.fillText(l.trim(),x,y+i*lineHeight-(lines.length-1)*lineHeight/2))}function wait(ms){return new Promise(r=>setTimeout(r,ms))}</script></body></html>
