<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Talking Picture to Video</title><style>body{font-family:Arial;background:#0f0f0f;color:#fff;text-align:center;padding:12px;margin:0}h1{color:#ff0050;font-size:20px;margin:8px 0}.box{background:#1e1e1e;padding:15px;border-radius:15px;max-width:520px;margin:10px auto}input,textarea,select,button{width:100%;padding:12px;margin:7px 0;border-radius:8px;border:none;font-size:15px;box-sizing:border-box}textarea{background:#2a2a2a;color:#fff;min-height:65px}button{background:#ff0050;color:#fff;font-weight:bold;cursor:pointer}button:disabled{background:#555}#preview{width:100%;max-height:420px;margin-top:10px;border-radius:10px;display:none;background:#000}.img-item{background:#2a2a2a;padding:10px;border-radius:10px;margin:8px 0;text-align:left;position:relative}.img-item img{width:60px;height:60px;object-fit:cover;border-radius:5px;vertical-align:middle}.small{font-size:12px;color:#aaa;line-height:1.4}.voice-row{display:flex;gap:8px}.voice-row select{flex:1}</style></head><body><h1>🗣️ Talking Photo Maker</h1><p class="small">Picture to Video + AI Voice - Makes your photo TALK</p><div class="box"><input type="file" id="images" accept="image/*" multiple><div id="list"></div><label>Seconds per photo:</label><input type="number" id="duration" value="4" min="2" max="10"><div class="voice-row"><div style="flex:1"><label>Voice:</label><select id="voiceSelect"><option>Loading voices...</option></select></div><div style="flex:1"><label>Text position:</label><select id="textPos"><option value="bottom">Bottom</option><option value="top">Top</option><option value="center">Center</option></select></div></div><label><input type="checkbox" id="talkCheck" checked style="width:auto"> 🔊 Make photo TALK (speak text aloud)</label><label><input type="checkbox" id="shakeCheck" checked style="width:auto"> 🕺 Add talking movement (shake/zoom)</label><button id="createBtn">🎬 CREATE TALKING VIDEO</button><button id="speakBtn" style="background:#0088ff;display:none">🔊 PLAY VOICE ONLY</button><button id="downloadBtn" style="display:none;background:#00d26a">⬇️ Download Video (with text)</button><video id="preview" controls playsinline></video><p id="status" class="small"></p><p class="small" style="background:#2a2a2a;padding:8px;border-radius:8px">💡 Tip: Video download will have text. Voice is live AI speech. To save voice + video together, use screen recorder while playing.</p></div><canvas id="canvas" style="display:none"></canvas><script>let filesData=[];let voices=[];function loadVoices(){const v=speechSynthesis.getVoices();if(v.length){voices=v;const sel=document.getElementById('voiceSelect');sel.innerHTML='';v.forEach((voice,i)=>{const o=document.createElement('option');o.value=i;o.textContent=voice.name+' ('+voice.lang+')';sel.appendChild(o)});}}speechSynthesis.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,500);document.getElementById('images').onchange=e=>{filesData=Array.from(e.target.files).map(f=>({file:f,text:''}));renderList()};function renderList(){const list=document.getElementById('list');list.innerHTML='';filesData.forEach((item,idx)=>{const div=document.createElement('div');div.className='img-item';const url=URL.createObjectURL(item.file);div.innerHTML=`<img src="${url}"> <b>Photo ${idx+1}</b><br><textarea placeholder="What should this person say? Example: Hello my friends, welcome!" oninput="filesData[${idx}].text=this.value"></textarea>`;list.appendChild(div)});document.getElementById('status').innerText=filesData.length+' photos loaded - now write what each person should SAY'}document.getElementById('createBtn').onclick=async()=>{if(filesData.length==0){alert('Select pictures first');return}const duration=parseInt(document.getElementById('duration').value);const pos=document.getElementById('textPos').value;const shouldTalk=document.getElementById('talkCheck').checked;const shouldShake=document.getElementById('shakeCheck').checked;const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');canvas.width=720;canvas.height=1280;const stream=canvas.captureStream(30);const recorder=new MediaRecorder(stream,{mimeType:'video/webm'});let chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});const url=URL.createObjectURL(blob);const v=document.getElementById('preview');v.src=url;v.style.display='block';const dl=document.getElementById('downloadBtn');dl.style.display='block';dl.onclick=()=>{const a=document.createElement('a');a.href=url;a.download='talking-photo-video.webm';a.click()};document.getElementById('speakBtn').style.display='block';document.getElementById('status').innerText='✅ Video ready! Tap PLAY to hear voice. Video + Voice playing together = talking photo!'};recorder.start();document.getElementById('status').innerText='⏳ Creating talking video...';for(let idx=0;idx<filesData.length;idx++){const item=filesData[idx];const img=await loadImage(item.file);if(shouldTalk&&item.text){speakText(item.text);}const start=Date.now();let shakePhase=0;while(Date.now()-start<duration*1000){ctx.clearRect(0,0,canvas.width,canvas.height);let scale=1;let offsetX=0;let offsetY=0;if(shouldShake&&shouldTalk&&item.text){shakePhase+=0.3;scale=1+Math.sin(shakePhase)*0.03;offsetX=Math.sin(shakePhase*1.5)*8;offsetY=Math.cos(shakePhase*2)*5;}const baseScale=Math.max(canvas.width/img.width,canvas.height/img.height);const finalScale=baseScale*scale;const x=(canvas.width-img.width*finalScale)/2+offsetX;const y=(canvas.height-img.height*finalScale)/2+offsetY;ctx.drawImage(img,x,y,img.width*finalScale,img.height*finalScale);if(item.text){drawText(ctx,item.text,canvas.width,canvas.height,pos);}await wait(33);}if(shouldTalk){await wait(500);speechSynthesis.cancel();}}recorder.stop()};document.getElementById('speakBtn').onclick=()=>{filesData.forEach((item,i)=>{setTimeout(()=>{if(item.text)speakText(item.text)},i*4000)})};function speakText(t){speechSynthesis.cancel();const ut=new SpeechSynthesisUtterance(t);const sel=document.getElementById('voiceSelect');if(voices[sel.value])ut.voice=voices[sel.value];ut.rate=0.95;ut.pitch=1;speechSynthesis.speak(ut);}function loadImage(file){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=URL.createObjectURL(file)})}function drawText(ctx,text,w,h,pos){ctx.fillStyle="rgba(0,0,0,0.65)";let y=h-180;if(pos=="top")y=120;if(pos=="center")y=h/2;ctx.fillRect(0,y-60,w,150);ctx.fillStyle="#fff";ctx.font="bold 30px Arial";ctx.textAlign="center";wrapText(ctx,text,w/2,y,w-70,38);}function wrapText(ctx,text,x,y,maxWidth,lineHeight){const words=text.split(' ');let line='';let lines=[];for(let n=0;n<words.length;n++){let testLine=line+words[n]+' ';if(ctx.measureText(testLine).width>maxWidth&&n>0){lines.push(line);line=words[n]+' ';}else{line=testLine;}}lines.push(line);lines.forEach((l,i)=>ctx.fillText(l.trim(),x,y+i*lineHeight-(lines.length-1)*lineHeight/2));}function wait(ms){return new Promise(r=>setTimeout(r,ms))}</script></body></html>
